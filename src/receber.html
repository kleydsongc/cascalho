	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
			// O caminho ../ busca o sw.js na raiz do projeto
			navigator.serviceWorker.register('../sw.js')
				.then(reg => console.log('Service Worker ativo!', reg))
				.catch(err => console.error('Erro no Service Worker:', err));
			});
		}
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Idiqlat:wght@200;300;400&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

	<title>Receber | Cascalho</title>
</head>
<body>
	<div class="cabecalho">
		<span>Vai pingar: <span class="total-geral">0</span></span>
	</div>

	<main class="page">

		<section class="periodo">
			<button type="button" id="btn-mes-anterior" aria-label="Mês Anterior">
				<span class="material-symbols-outlined">arrow_left</span>
			</button>
			
			<!-- Input de mês que funciona como o título e seletor -->
			<input type="month" id="seletor-periodo" class="seletor-mes">

			<button type="button" id="btn-mes-seguinte" aria-label="Mês Seguinte">
				<span class="material-symbols-outlined">arrow_right</span>
			</button>
		</section>

		<section class="cards">
			<button type="button" class="add" aria-label="adicionar recebimento">+</button>
<!--########## MODAL ##########-->
			<dialog id="modal-recebimento">
				<form method="dialog" class="registro">
					<header class="modal-header">
						<h2>Novo registro</h2>
						<button type="button" class="fechar-modal" aria-label="Fechar">X</button>
					</header>

					<!-- Título e Status do Card -->
					<div class="form-group">
						<label for="ref">Título (Pessoa ou Dívida)</label>
						<input type="text" id="ref" placeholder="Ex: Cartão, José..." required>
					</div>

					<div class="form-group">
						<label for="status">Status</label>
						<select id="status" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; background-color: white;">
							<option value="Pendente">Pendente</option>
							<option value="Pago">Pago</option>
							<option value="Atrasado">Atrasado</option>
						</select>
					</div>

					<div class="form-group">
						<label for="vencimento">Data de Vencimento</label>
						<input type="date" id="vencimento" required>
					</div>

					<hr style="border: 0; border-top: 1px solid rgba(141, 220, 164, 0.3); margin: 8px 0;">
					<h3 style="margin: 0; font-size: 16px; text-transform: uppercase;">Itens do Card</h3>

					<!-- Container onde as linhas de itens serão inseridas pelo JS -->
					<div id="itens-container" style="display: flex; flex-direction: column; gap: 12px;"></div>

					<button type="button" id="btn-add-item" style="background: transparent; color: #8ddca4; border: 1px dashed #8ddca4; border-radius: 8px; margin-top: 8px; padding: 10px; cursor: pointer;">
						+ Adicionar Item
					</button>

					<button type="submit" class="salvar" style="margin-top: 16px;">Salvar</button>
				</form>
			</dialog>

			<div id="listagem"></div>

			<!--<article class="card">
				<header>
					<span class="devedor">Pai</span>
					<span class="card-total">0</span>

			</article>-->

		</section>
	</main>
